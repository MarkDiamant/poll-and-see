name: Use preloaded next poll immediately
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/use-preloaded-next-poll.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make targeted edit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/poll/[slug]/page.tsx')
          s=p.read_text()
          start=s.index('    void preloadQueue([...currentShownIds, pollId], flowAnchorCategory).then(() => {', s.index('onVoteComplete='))
          end=s.index('    });', start)+7
          old=s[start:end]
          new='''    const appendNextPreloadedPoll = () => {
      while (preloadedQueueRef.current.length > 0) {
        const next = preloadedQueueRef.current.shift();
        if (!next) break;
        if (currentShownIds.includes(next.poll.id)) continue;
        if (skippedPollIdsRef.current.has(next.poll.id)) continue;
        if (hasLocalVote(next.poll.id)) continue;

        setShowEndOfFeed(false);
        setPolls((current) => {
          if (current.some((item) => item.poll.id === next.poll.id)) return current;
          return [...current, next];
        });

        if (shouldShowSponsor) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const sponsorEl = sponsorByPollContainerRef.current[pollId];
              if (sponsorEl) smoothScrollToElement(sponsorEl, 650, 8);
            });
          });
        }

        void preloadQueue([...currentShownIds, pollId, next.poll.id], flowAnchorCategory);
        return true;
      }
      return false;
    };

    if (!appendNextPreloadedPoll()) {
      void preloadQueue([...currentShownIds, pollId], flowAnchorCategory).then(() => {
        if (!appendNextPreloadedPoll()) setShowEndOfFeed(true);
      });
    }'''
          if 'setShowEndOfFeed(true);' not in old or 'preloadedQueueRef.current.shift()' not in old:
              raise SystemExit('Target block validation failed')
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add 'app/poll/[slug]/page.tsx'
          git commit -m 'Use preloaded next poll immediately'
          git push
