name: Fix mobile region
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-mobile-region.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add region selector to mobile submissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/submissions/page.tsx')
          s = p.read_text()
          old = '''                  <div className="grid grid-cols-2 gap-2">\n                    <div>\n                      <p className="mb-1 text-xs text-gray-400">Category</p>'''
          new = '''                  <div className="grid grid-cols-2 gap-2">\n                    <div>\n                      <p className="mb-1 text-xs text-gray-400">Region</p>\n                      <select\n                        value={regionEdits[submission.id] || "Universal"}\n                        onChange={(event) => {\n                          const nextRegion = event.target.value as "UK" | "US" | "Universal";\n                          setRegionEdits((current) => ({ ...current, [submission.id]: nextRegion }));\n                          void saveSubmission(submission.id, { region: nextRegion });\n                        }}\n                        className="h-10 w-full rounded-lg border border-gray-700 bg-gray-900 px-2 text-xs text-white outline-none"\n                      >\n                        <option value="Universal">🌍 Universal</option>\n                        <option value="UK">🇬🇧 UK</option>\n                        <option value="US">🇺🇸 US</option>\n                      </select>\n                    </div>\n\n                    <div>\n                      <p className="mb-1 text-xs text-gray-400">Category</p>'''
          if old not in s:
              raise SystemExit('target mobile settings block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/submissions/page.tsx
          git commit -m "Show region on mobile submissions"
          git push
