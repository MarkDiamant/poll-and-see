name: Final 300ms poll scroll adjustment
on:
  push:
    paths:
      - '.github/workflows/one-time-preload-fix.yml'
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only follow-on scroll and clean workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/poll/[slug]/page.tsx')
          s=p.read_text()
          old='smoothScrollToElement(pollEl as HTMLElement, 400, 8);'
          new='smoothScrollToElement(pollEl as HTMLElement, 300, 8);'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/one-time-preload-fix.yml .github/workflows/set-poll-scroll-300.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Speed up follow-on poll scroll to 300ms'
          git push
