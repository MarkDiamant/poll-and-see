name: One time preload optimisation
on:
  push:
    paths:
      - '.github/workflows/one-time-preload-fix.yml'
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/poll/[slug]/page.tsx')
          s=p.read_text()
          old='''    void preloadQueue([...currentShownIds, pollId], flowAnchorCategory).then(() => {
      while (preloadedQueueRef.current.length > 0) {
        const next = preloadedQueueRef.current.shift();
        if (!next) break;
        if (currentShownIds.includes(next.poll.id)) continue;
        if (skippedPollIdsRef.current.has(next.poll.id)) continue;
        if (hasLocalVote(next.poll.id)) continue;

        setShowEndOfFeed(false);
        setPolls((current) => {
          if (current.some((item) => item.poll.id === next.poll.id)) return current;
          return [...current, next];
        });

        if (shouldShowSponsor) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const sponsorEl = sponsorByPollContainerRef.current[pollId];
              if (sponsorEl) {
                smoothScrollToElement(sponsorEl, 650, 8);
              }
            });
          });
        }

        return;
      }

      setShowEndOfFeed(true);
    });'''
          new='''    const appendNextPreloadedPoll = () => {
      while (preloadedQueueRef.current.length > 0) {
        const next = preloadedQueueRef.current.shift();
        if (!next) break;
        if (currentShownIds.includes(next.poll.id)) continue;
        if (skippedPollIdsRef.current.has(next.poll.id)) continue;
        if (hasLocalVote(next.poll.id)) continue;

        setShowEndOfFeed(false);
        setPolls((current) => {
          if (current.some((item) => item.poll.id === next.poll.id)) return current;
          return [...current, next];
        });

        if (shouldShowSponsor) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const sponsorEl = sponsorByPollContainerRef.current[pollId];
              if (sponsorEl) {
                smoothScrollToElement(sponsorEl, 650, 8);
              }
            });
          });
        }

        void preloadQueue([...currentShownIds, pollId, next.poll.id], flowAnchorCategory);
        return true;
      }
      return false;
    };

    if (!appendNextPreloadedPoll()) {
      void preloadQueue([...currentShownIds, pollId], flowAnchorCategory).then(() => {
        if (!appendNextPreloadedPoll()) setShowEndOfFeed(true);
      });
    }'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit code
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add 'app/poll/[slug]/page.tsx'
          git commit -m 'Use preloaded next poll immediately'
          git push
